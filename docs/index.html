<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="Ranger 的私人电影片单：记录待看、已看时间、主演、豆瓣评分与每周推荐。" />
    <meta property="og:title" content="放映清单 · 今晚，想看什么？" />
    <meta property="og:description" content="一份会记住观看进度的私人电影片单。" />
    <title>放映清单 · 我的待看电影</title>
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambientOne" aria-hidden="true"></div>
    <div class="ambient ambientTwo" aria-hidden="true"></div>
    <header class="siteHeader">
      <a class="brand" href="#top" aria-label="返回顶部"><span class="brandMark" aria-hidden="true"><i></i><i></i><i></i></span><span>放映清单</span></a>
      <nav aria-label="页面导航"><a href="#new">新加入</a><a href="#all">全部</a><a href="#watched">已看</a></nav>
      <div class="headerMeta"><span class="liveDot" aria-hidden="true"></span> 私人片单</div>
    </header>

    <main id="top">
      <section class="featuredHero" id="featured" aria-live="polite"></section>

      <section class="contentSection" id="new">
        <div class="sectionHeading"><div><p class="sectionKicker">JUST ADDED</p><h2>本周新加入</h2></div><p>刚放进片单的新鲜候选，先从这里开始挑。</p></div>
        <div class="spotlightRow" id="new-list"></div>
      </section>

      <section class="contentSection prioritySection">
        <div class="sectionHeading"><div><p class="sectionKicker">TOP PRIORITY</p><h2>最想看的</h2></div><button class="textButton" type="button" data-random>帮我随机选一部 →</button></div>
        <div class="priorityList" id="priority-list"></div>
      </section>

      <section class="contentSection library" id="all">
        <div class="libraryHeading">
          <div><p class="sectionKicker">THE FULL LIST</p><h2>全部片单</h2></div>
          <div class="controls">
            <label class="searchBox"><span aria-hidden="true">⌕</span><span class="srOnly">搜索电影</span><input id="search-input" type="search" placeholder="搜索片名、导演或主演" autocomplete="off" /></label>
            <div class="statusTabs" id="status-tabs" aria-label="按状态筛选"></div>
          </div>
        </div>
        <div class="filters" id="filters" aria-label="按类型筛选"></div>
        <div class="movieGrid" id="movie-grid" aria-live="polite"></div>
        <div class="emptyState" id="empty-state" hidden><p>没有找到匹配的电影</p><button type="button" data-reset>清除筛选</button></div>
      </section>

      <section class="contentSection watchedSection" id="watched">
        <div class="sectionHeading"><div><p class="sectionKicker">WATCHED ARCHIVE</p><h2>已看记录</h2></div><p>每次勾选“已看”，这里会自动留下完成时间。</p></div>
        <div id="watched-list"></div>
      </section>
    </main>

    <footer><p>一份会记住观看进度的私人片单。</p><p>电影资料来自 <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">TMDB</a>、豆瓣等公开页面；评分会随片单更新同步查询。</p></footer>

    <dialog class="movieDialog" id="movie-dialog">
      <button class="dialogClose" id="dialog-close" type="button" aria-label="关闭详情">×</button>
      <div id="dialog-content"></div>
    </dialog>
    <script src="./app.js" defer></script>
  </body>
</html>
